    stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cardinal tick marks -->
  <line x1="17" y1="1" x2="17" y2="3.5" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="17" y1="30.5" x2="17" y2="33" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="1" y1="17" x2="3.5" y2="17" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30.5" y1="17" x2="33" y2="17" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
