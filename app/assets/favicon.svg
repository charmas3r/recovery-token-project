<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 34 34" fill="none">
  <!-- Dark background tile -->
  <rect width="34" height="34" rx="6" fill="#0A0A0A"/>
  <!-- Outer coin ring -->
  <circle cx="17" cy="17" r="15.5" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
  <!-- Inner recess ring -->
  <circle cx="17" cy="17" r="12.5" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <!-- Engraved M letterform -->
  <path d="M9.5 22.5 L9.5 12 L14 19 L17 14.5 L20 19 L24.5 12 L24.5 22.5"
